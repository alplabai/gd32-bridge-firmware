# SPDX-License-Identifier: Apache-2.0
#
# CI for the GD32 bridge firmware.
#
# What this CAN check, and what it deliberately cannot:
#
#   * The `stub` backend job compiles every protocol/dispatch source with the
#     hardware-touching HAL replaced by hal/bridge_hw_stub.c.  src/ota.c's
#     armed state machine is gated by BRIDGE_OTA_PARTITIONED (CMakeLists.txt),
#     which defaults OFF and is preprocessed away to a 22-line inert stub
#     when unset -- that job alone does NOT compile the OTA state machine.
#     BRIDGE_HAL_BACKEND=stub only forces this transitively: CMakeLists.txt
#     FATAL_ERRORs if BRIDGE_OTA_PARTITIONED=ON is combined with the stub
#     backend, since the armed OTA path needs the real gd32 HAL to flash.
#   * The `gd32 backend build` job (below) stages the real GD32 firmware
#     library from the pinned public mirror
#     https://github.com/alplabai/gd32g5x3-firmware-library and configures
#     -DBRIDGE_HAL_BACKEND=gd32 -DBRIDGE_OTA_PARTITIONED=ON, which compiles
#     and links every hal/gd32/*.c file, hal/transport_hw_gd32.c,
#     hal/fmc_ota.c, src/ota.c's real armed state machine, and
#     src/boot/boot_main.c -- the layer no other job here touches.
#     Compile-and-link only; it proves nothing about on-silicon behaviour.
#   * On-silicon behaviour is NOT covered by any job here.  The bridge talks
#     SPI and I2C to a Renesas RZ/V2N on a real SoM; nothing here substitutes
#     for a bench run.
#
# The protocol vectors ARE checked, and that is the strongest gate available
# without hardware: tests/gen_protocol_vectors.py is the authoritative source
# for the canonical wire vectors consumed by BOTH this firmware and the
# host-side driver tests in alp-sdk.  Regenerating and diffing turns "the wire
# changed" from something you notice on a bench into a failing check.

name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stub-build:
    name: stub build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # This is Cortex-M33 firmware: every target is linked against a device
      # linker script and post-processed with objcopy, so the host compiler
      # cannot build it even with the stub HAL.  toolchain/arm-none-eabi.cmake
      # is the invocation CMakeLists.txt documents, and it sets
      # CMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY precisely because the
      # result is freestanding and never runs on the builder.
      - name: install the Arm GNU toolchain
        run: |
          sudo apt-get update -qq
          # libnewlib-arm-none-eabi is NOT optional and is a separate package
          # on Debian/Ubuntu: gcc-arm-none-eabi alone installs the compiler
          # with no C library headers, so the first #include <string.h> fails
          # with "No such file or directory" -- which reads like a source bug
          # and is not one.
          sudo apt-get install -y --no-install-recommends \
            gcc-arm-none-eabi libnewlib-arm-none-eabi
          arm-none-eabi-gcc --version | head -1
          # Prove the headers are actually reachable before CMake tries, so a
          # packaging regression reports itself here rather than as a confusing
          # "fatal error: string.h" against a source file.
          printf '#include <string.h>\nint main(void){return 0;}\n' > /tmp/hdr.c
          arm-none-eabi-gcc -mcpu=cortex-m33 -mthumb -c /tmp/hdr.c -o /tmp/hdr.o
          echo "newlib headers reachable"

      - name: configure
        run: |
          cmake -B build -S . \
            -DCMAKE_TOOLCHAIN_FILE=toolchain/arm-none-eabi.cmake \
            -DBRIDGE_HAL_BACKEND=stub

      - name: build
        run: cmake --build build -j"$(nproc)"

  unit-tests:
    name: unit tests (host)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Four suites, all linking the REAL firmware sources -- ota.c, crc32.c,
      # transport_spi.c, transport_i2c.c, protocol.c, bootloader.c -- so the OTA
      # bounds checks and the CS/register framing seams under test are the same
      # code paths the device runs.  ota, transport_spi and transport_i2c link
      # hal/bridge_hw_stub.c and are mock-free end to end.
      #
      # The `protocol` suite is the deliberate exception: it links
      # tests/unit/fake/bridge_hw_fake.c INSTEAD of the stub.  The stub answers
      # BRIDGE_HW_ERR_NOTIMPL for nearly everything, so only about two hardware
      # opcodes can ever reach STATUS_OK through it -- which left src/protocol.c's
      # reply encoding and its BRIDGE_HW_ERR_* -> STATUS_* ladders unreachable
      # from any host test.  The fake is injectable (a forced return code per
      # function) and resettable, so that suite trades the real HAL for
      # reachability.  It is test-only and lives under tests/unit/ so no firmware
      # build can pick it up.
      #
      # The first two suites came from alp-sdk, where they ran under twister; the
      # firmware moved here (alp-sdk ADR 0031) and the tests moved with it,
      # because a test that lives in a different repository from its subject is a
      # test nobody runs.
      #
      # Host-only, no Zephyr: the code under test is freestanding C, and only
      # the ztest harness was ever Zephyr-specific.  tests/unit/ztest_shim.h
      # replaces the six macros the suites use.
      - name: configure
        run: cmake -S tests/unit -B build-tests -DCMAKE_BUILD_TYPE=Debug

      - name: build
        run: cmake --build build-tests --parallel

      - name: run
        run: ctest --test-dir build-tests --output-on-failure

  protocol-vectors:
    name: protocol vectors are regenerated
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # tests/gen_protocol_vectors.py calls itself the authoritative source for
      # these vectors, and its own docstring says to diff the output against git
      # to spot unexpected wire changes.  This is that diff, run automatically.
      # A committed protocol_vectors.txt that the generator no longer produces
      # means the wire moved and one of the two sides was not updated -- and the
      # OTHER consumer is in a different repository (alp-sdk's host-side driver
      # tests), so nothing else would notice.
      - name: regenerate and diff
        run: |
          set -euo pipefail
          python3 tests/gen_protocol_vectors.py
          if ! git diff --exit-code -- tests/protocol_vectors.txt; then
            echo "::error::tests/protocol_vectors.txt is not what gen_protocol_vectors.py produces."
            echo "Regenerate it and commit the result, in the SAME change as the wire edit."
            exit 1
          fi

  clang-format:
    name: clang-format (diff only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Diff-only: this tree carries vendor-shaped sources and a tree-wide
      # reformat would bury a real review in noise.
      - name: install clang-format 22
        run: pipx install "clang-format==22.1.5"

      - name: check changed C/H files
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          if [ -z "$base" ]; then base=$(git rev-parse HEAD~1); fi
          files=$(git diff --name-only --diff-filter=ACMR "$base" HEAD -- '*.c' '*.h' || true)
          if [ -z "$files" ]; then echo "no C/H files changed"; exit 0; fi
          echo "$files"
          # shellcheck disable=SC2086
          clang-format --dry-run --Werror $files

  no-build-artifacts:
    name: no build artifacts or crash dumps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The sibling cc3501e repo had a 14 MB .out, a 2 MB .map and MSYS
      # *.stackdump files swept in by `git add -A` on the Windows bench.  This
      # tree is clean today; the check is here to keep it that way.
      - name: reject tracked artifacts
        run: |
          set -euo pipefail
          bad=$(git ls-files | grep -E '\.(stackdump|out|map|o|obj|elf|bin|hex)$' || true)
          if [ -n "$bad" ]; then
            echo "::error::build artifacts / crash dumps are tracked:"
            echo "$bad"
            exit 1
          fi
          echo "clean"

  python-lint:
    name: python tooling compiles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # tools/gen_ota_metadata.py builds the metadata that describes an OTA
      # image.  A syntax error there is a broken release step, found at release
      # time unless something checks it.
      - name: byte-compile
        run: python3 -m compileall -q tests tools

  gd32-backend-build:
    name: gd32 backend build
    runs-on: ubuntu-latest
    steps:
      # No CI job compiles hal/gd32/*.c, hal/fmc_ota.c, src/ota.c's real armed
      # state machine, or src/boot/boot_main.c (Refs #77, #31 E1) -- the
      # stub-build job above replaces the hardware HAL and never enables
      # BRIDGE_OTA_PARTITIONED. This job builds them for real, against the
      # real GD32 firmware library.  Compile-and-link only: it proves a
      # register name, a bit width, or a type is right enough to build --
      # NOT that the register sequence is correct on real silicon.  Nothing
      # here is a substitute for a bench run, and this job intentionally
      # carries no `needs-silicon` label.
      #
      # Checked out at $GITHUB_WORKSPACE (repo root) -- NOT re-nested at
      # firmware/gd32-bridge. This repo split out of alp-sdk (alp-sdk#1370)
      # and that pre-split nesting exists nowhere any more; reconstructing
      # it here just to let CMakeLists.txt's `../../vendors/gd32_firmware_
      # library` fallback resolve (Refs #110) meant a typo'd or rescoped
      # GD32_VENDOR_DIR, and the FATAL_ERROR #67 added for a missing vendor
      # tree, both stayed untested -- every job here took the fallback
      # branch instead. The vendor tree is staged under $RUNNER_TEMP below
      # and passed explicitly via -DGD32_VENDOR_DIR, so this job now
      # exercises the flag PR #67 actually added.
      - uses: actions/checkout@v4

      # Same install as the stub-build job above, INCLUDING the newlib-header
      # preflight: libnewlib-arm-none-eabi is a separate Debian/Ubuntu
      # package from gcc-arm-none-eabi, and without it the first
      # #include <string.h> here fails with a confusing "No such file or
      # directory" that reads like a source bug in this job's own code.
      # Installed before any `cmake` invocation below: project() probes the
      # toolchain immediately, before CMakeLists.txt's own GD32_VENDOR_DIR
      # logic ever runs.
      - name: install the Arm GNU toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            gcc-arm-none-eabi libnewlib-arm-none-eabi
          arm-none-eabi-gcc --version | head -1
          printf '#include <string.h>\nint main(void){return 0;}\n' > /tmp/hdr.c
          arm-none-eabi-gcc -mcpu=cortex-m33 -mthumb -c /tmp/hdr.c -o /tmp/hdr.o
          echo "newlib headers reachable"

      # Negative path (Refs #110): no -DGD32_VENDOR_DIR, and nothing staged
      # yet at any fallback location, so CMakeLists.txt's
      # `if(NOT EXISTS ${_GD32_VENDOR_DIR}/CMakeLists.txt)` guard must fire.
      # Asserts on the FATAL_ERROR message text, not just the non-zero exit
      # -- the message naming `-DGD32_VENDOR_DIR` is the actual fix #67
      # delivered; a exit-code-only check would pass just as happily if the
      # message regressed to something unhelpful.
      - name: configure (gd32 backend, no vendor tree) must fail naming the flag
        run: |
          set -uo pipefail
          if out=$(cmake -B build-negative -S . \
              -DCMAKE_TOOLCHAIN_FILE=toolchain/arm-none-eabi.cmake \
              -DBRIDGE_HAL_BACKEND=gd32 2>&1); then
            echo "$out"
            echo "::error::configure succeeded with no GD32_VENDOR_DIR and no vendor tree staged; expected the FATAL_ERROR from #67"
            exit 1
          fi
          echo "$out"
          if ! echo "$out" | grep -q -- '-DGD32_VENDOR_DIR'; then
            echo "::error::configure failed as expected, but the message does not name -DGD32_VENDOR_DIR"
            exit 1
          fi
          echo "negative path OK: FATAL_ERROR names -DGD32_VENDOR_DIR"

      # ci/gd32_vendor_wrapper/CMakeLists.txt is this repo's own Apache-2.0
      # glue (a copy of alp-sdk's vendors/gd32_firmware_library/CMakeLists.txt
      # wrapper) -- it is NOT GigaDevice IP and carries no vendor licence
      # terms.  Staged under $RUNNER_TEMP (outside the checkout, cleaned up
      # by the runner after the job) -- a location with no significance
      # other than "somewhere GD32_VENDOR_DIR can point at", which is the
      # point: it is not the fallback path.
      - name: stage the vendor wrapper CMakeLists
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gd32_vendor/gd32_firmware_library"
          cp ci/gd32_vendor_wrapper/CMakeLists.txt \
             "$RUNNER_TEMP/gd32_vendor/gd32_firmware_library/CMakeLists.txt"

      # The actual GD32G5x3 firmware library IS GigaDevice IP, redistributed
      # under SLA-GD0001 v1.1 -- see that licence's terms, quoted in full in
      # this repo's PR body and in alp-sdk's vendors/gd32_firmware_library/
      # README.md.  It is not vendored into any repo's main tree; fetched
      # here from the pinned public mirror alp-sdk itself pins as a
      # submodule, at the immutable commit alp-sdk's gitlink points to --
      # NOT by tag: `git clone --branch` resolves a mutable annotated tag
      # (or a same-named branch, silently preferred if one ever exists),
      # so anyone with push to the mirror could retarget what this
      # required check compiles with no diff in this repo. The clone still
      # requests the tag (cheap, shallow, matches today's history), but the
      # checkout below fails closed if that tag no longer points where
      # alp-sdk's .gitmodules says it does.
      - name: fetch the GD32 vendor firmware library (pinned commit, via tag)
        timeout-minutes: 5
        env:
          GD32_VENDOR_PIN: 4a0258080c45227a31fd4c32fa2c4860ba11c16a
        run: |
          set -euo pipefail
          git clone --branch v1.5.0 --depth 1 \
            https://github.com/alplabai/gd32g5x3-firmware-library.git \
            "$RUNNER_TEMP/gd32_vendor/gd32_firmware_library/upstream"
          actual="$(git -C "$RUNNER_TEMP/gd32_vendor/gd32_firmware_library/upstream" rev-parse HEAD)"
          if [ "$actual" != "$GD32_VENDOR_PIN" ]; then
            echo "::error::vendor firmware library HEAD is $actual, expected $GD32_VENDOR_PIN -- tag v1.5.0 no longer points at the commit alp-sdk's .gitmodules pins. Update GD32_VENDOR_PIN here in lockstep with any deliberate alp-sdk submodule bump; otherwise this is a moved tag and the build must not proceed."
            exit 1
          fi

      # BRIDGE_OTA_PARTITIONED=ON, with the gd32 backend, builds THREE
      # targets from one configure: gd32-bridge-slot-a and
      # gd32-bridge-slot-b (both compile src/ota.c's real BEGIN / WRITE_CHUNK
      # / VERIFY / COMMIT / ROLLBACK / GET_STATE / ABORT machine, since
      # BRIDGE_OTA_PARTITIONED is defined for them and src/ota.c:56-482 is no
      # longer preprocessed out), and gd32-bootloader (the only target that
      # compiles src/boot/boot_main.c).  All three share
      # CMakeLists.txt's GD32_BRIDGE_SOURCES list, so this single configure
      # also compiles every hal/gd32/*.c file and hal/transport_hw_gd32.c.
      # -DGD32_VENDOR_DIR points at the tree staged above -- the positive
      # path (Refs #110): this is the flag itself doing the work, not the
      # CMakeLists.txt fallback.
      # Negative path for the #127 guard, in the same style as the
      # GD32_VENDOR_DIR one above: the vendor tree IS staged now, but
      # ci/gd32_vendor_wrapper/CMakeLists.txt deliberately omits alp-sdk's
      # overrides/system_gd32g5x3.c, so configuring WITHOUT
      # -DBRIDGE_ALLOW_STOCK_SYSTEM_INIT must fail rather than emit an image
      # that hangs in system_clock_216m_hxtal() before main().  Asserts on
      # the message naming the flag, not just the non-zero exit -- an
      # exit-code-only check would pass just as happily if the guard started
      # firing for some unrelated reason.
      - name: configure (gd32 backend, no clock override) must fail naming the flag
        run: |
          set -uo pipefail
          if out=$(cmake -B build-negative-clock -S . \
              -DCMAKE_TOOLCHAIN_FILE=toolchain/arm-none-eabi.cmake \
              -DBRIDGE_HAL_BACKEND=gd32 \
              -DGD32_VENDOR_DIR="$RUNNER_TEMP/gd32_vendor/gd32_firmware_library" 2>&1); then
            echo "$out"
            echo "::error::configure succeeded against a vendor tree with no overrides/system_gd32g5x3.c; expected the FATAL_ERROR from #127 (this build would produce an image that hangs before main())"
            exit 1
          fi
          echo "$out"
          if ! echo "$out" | grep -q -- 'BRIDGE_ALLOW_STOCK_SYSTEM_INIT'; then
            echo "::error::configure failed as expected, but the message does not name -DBRIDGE_ALLOW_STOCK_SYSTEM_INIT"
            exit 1
          fi
          echo "negative path OK: FATAL_ERROR names -DBRIDGE_ALLOW_STOCK_SYSTEM_INIT"

      # -DBRIDGE_ALLOW_STOCK_SYSTEM_INIT=ON (#127): the wrapper staged above
      # carries no clock override, so this build links the STOCK vendor
      # SystemInit() and the resulting .bin HANGS before main() on real
      # silicon. That is fine and intended HERE -- this job compiles and
      # links only -- but the flag has to be explicit, so nothing produces a
      # bricking image by accident. Never add this flag to anything flashed.
      - name: configure (gd32 backend, OTA partitioned)
        run: |
          cmake -B build-gd32 -S . \
            -DCMAKE_TOOLCHAIN_FILE=toolchain/arm-none-eabi.cmake \
            -DBRIDGE_HAL_BACKEND=gd32 \
            -DBRIDGE_OTA_PARTITIONED=ON \
            -DBRIDGE_ALLOW_STOCK_SYSTEM_INIT=ON \
            -DGD32_VENDOR_DIR="$RUNNER_TEMP/gd32_vendor/gd32_firmware_library"

      - name: build
        run: cmake --build build-gd32 -j"$(nproc)"

      # BRIDGE_OTA_PARTITIONED defaults OFF: that's the non-partitioned
      # `gd32-bridge` target linked against toolchain/gd32g553_flash.ld --
      # the image actually flashed to the bench -- and no other job here
      # links it against the gd32 backend. Same vendor fetch already staged
      # above; one extra configure+build closes that gap.
      - name: configure (gd32 backend, full-flash / non-partitioned)
        run: |
          cmake -B build-gd32-flash -S . \
            -DCMAKE_TOOLCHAIN_FILE=toolchain/arm-none-eabi.cmake \
            -DBRIDGE_HAL_BACKEND=gd32 \
            -DBRIDGE_ALLOW_STOCK_SYSTEM_INIT=ON \
            -DGD32_VENDOR_DIR="$RUNNER_TEMP/gd32_vendor/gd32_firmware_library"

      - name: build (full-flash)
        run: cmake --build build-gd32-flash -j"$(nproc)"
