# SPDX-License-Identifier: Apache-2.0
#
# CI for the GD32 bridge firmware.
#
# What this CAN check, and what it deliberately cannot:
#
#   * The `stub` backend job compiles every protocol/dispatch source with the
#     hardware-touching HAL replaced by hal/bridge_hw_stub.c.  src/ota.c's
#     armed state machine is gated by BRIDGE_OTA_PARTITIONED (CMakeLists.txt),
#     which defaults OFF and is preprocessed away to a 22-line inert stub
#     when unset -- that job alone does NOT compile the OTA state machine.
#     BRIDGE_HAL_BACKEND=stub only forces this transitively: CMakeLists.txt
#     FATAL_ERRORs if BRIDGE_OTA_PARTITIONED=ON is combined with the stub
#     backend, since the armed OTA path needs the real gd32 HAL to flash.
#   * The `gd32 backend build` job (below) fetches the real GD32 firmware
#     library from GigaDevice's official repository
#     (tools/fetch_gd32_library.sh, pinned commit + tree hash) and configures
#     -DBRIDGE_HAL_BACKEND=gd32 -DBRIDGE_OTA_PARTITIONED=ON, which compiles
#     and links every hal/gd32/*.c file, hal/transport_hw_gd32.c,
#     hal/fmc_ota.c, src/ota.c's real armed state machine, and
#     src/boot/boot_main.c -- the layer no other job here touches.
#     It also verifies that every real image's fault vectors resolve to the
#     strong diagnostic handlers rather than the vendor weak aliases.
#     Compile-and-link/static inspection only; it proves nothing about
#     on-silicon behaviour.
#   * On-silicon behaviour is NOT covered by any job here.  The bridge talks
#     SPI and I2C to a Renesas RZ/V2N on a real SoM; nothing here substitutes
#     for a bench run.
#
# The protocol vectors ARE checked, and that is the strongest gate available
# without hardware: tests/gen_protocol_vectors.py is the authoritative source
# for the canonical wire vectors consumed by BOTH this firmware and the
# host-side driver tests in alp-sdk.  Regenerating and diffing turns "the wire
# changed" from something you notice on a bench into a failing check.

name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stub-build:
    name: stub build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # This is Cortex-M33 firmware: every target is linked against a device
      # linker script and post-processed with objcopy, so the host compiler
      # cannot build it even with the stub HAL.  toolchain/arm-none-eabi.cmake
      # is the invocation CMakeLists.txt documents, and it sets
      # CMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY precisely because the
      # result is freestanding and never runs on the builder.
      - name: install the Arm GNU toolchain
        run: |
          sudo apt-get update -qq
          # libnewlib-arm-none-eabi is NOT optional and is a separate package
          # on Debian/Ubuntu: gcc-arm-none-eabi alone installs the compiler
          # with no C library headers, so the first #include <string.h> fails
          # with "No such file or directory" -- which reads like a source bug
          # and is not one.
          sudo apt-get install -y --no-install-recommends \
            gcc-arm-none-eabi libnewlib-arm-none-eabi
          arm-none-eabi-gcc --version | head -1
          # Prove the headers are actually reachable before CMake tries, so a
          # packaging regression reports itself here rather than as a confusing
          # "fatal error: string.h" against a source file.
          printf '#include <string.h>\nint main(void){return 0;}\n' > /tmp/hdr.c
          arm-none-eabi-gcc -mcpu=cortex-m33 -mthumb -c /tmp/hdr.c -o /tmp/hdr.o
          echo "newlib headers reachable"

      - name: configure
        run: |
          cmake -B build -S . \
            -DCMAKE_TOOLCHAIN_FILE=toolchain/arm-none-eabi.cmake \
            -DBRIDGE_HAL_BACKEND=stub

      - name: build
        run: cmake --build build -j"$(nproc)"

  unit-tests:
    name: unit tests (host)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Four suites, all linking the REAL firmware sources -- ota.c, crc32.c,
      # transport_spi.c, transport_i2c.c, protocol.c, bootloader.c -- so the OTA
      # bounds checks and the CS/register framing seams under test are the same
      # code paths the device runs.  ota, transport_spi and transport_i2c link
      # hal/bridge_hw_stub.c and are mock-free end to end.
      #
      # The `protocol` suite is the deliberate exception: it links
      # tests/unit/fake/bridge_hw_fake.c INSTEAD of the stub.  The stub answers
      # BRIDGE_HW_ERR_NOTIMPL for nearly everything, so only about two hardware
      # opcodes can ever reach STATUS_OK through it -- which left src/protocol.c's
      # reply encoding and its BRIDGE_HW_ERR_* -> STATUS_* ladders unreachable
      # from any host test.  The fake is injectable (a forced return code per
      # function) and resettable, so that suite trades the real HAL for
      # reachability.  It is test-only and lives under tests/unit/ so no firmware
      # build can pick it up.
      #
      # The first two suites came from alp-sdk, where they ran under twister; the
      # firmware moved here (alp-sdk ADR 0031) and the tests moved with it,
      # because a test that lives in a different repository from its subject is a
      # test nobody runs.
      #
      # Host-only, no Zephyr: the code under test is freestanding C, and only
      # the ztest harness was ever Zephyr-specific.  tests/unit/ztest_shim.h
      # replaces the six macros the suites use.
      - name: configure
        run: cmake -S tests/unit -B build-tests -DCMAKE_BUILD_TYPE=Debug

      - name: build
        run: cmake --build build-tests --parallel

      - name: run
        run: ctest --test-dir build-tests --output-on-failure

  protocol-vectors:
    name: protocol vectors are regenerated
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # tests/gen_protocol_vectors.py calls itself the authoritative source for
      # these vectors, and its own docstring says to diff the output against git
      # to spot unexpected wire changes.  This is that diff, run automatically.
      # A committed protocol_vectors.txt that the generator no longer produces
      # means the wire moved and one of the two sides was not updated -- and the
      # OTHER consumer is in a different repository (alp-sdk's host-side driver
      # tests), so nothing else would notice.
      - name: regenerate and diff
        run: |
          set -euo pipefail
          python3 tests/gen_protocol_vectors.py
          if ! git diff --exit-code -- tests/protocol_vectors.txt; then
            echo "::error::tests/protocol_vectors.txt is not what gen_protocol_vectors.py produces."
            echo "Regenerate it and commit the result, in the SAME change as the wire edit."
            exit 1
          fi

  clang-format:
    name: clang-format (diff only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Diff-only: this tree carries vendor-shaped sources and a tree-wide
      # reformat would bury a real review in noise.
      - name: install clang-format 22
        run: pipx install "clang-format==22.1.5"

      - name: check changed C/H files
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          if [ -z "$base" ]; then base=$(git rev-parse HEAD~1); fi
          files=$(git diff --name-only --diff-filter=ACMR "$base" HEAD -- '*.c' '*.h' || true)
          if [ -z "$files" ]; then echo "no C/H files changed"; exit 0; fi
          echo "$files"
          # shellcheck disable=SC2086
          clang-format --dry-run --Werror $files

  no-build-artifacts:
    name: no build artifacts or crash dumps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The sibling cc3501e repo had a 14 MB .out, a 2 MB .map and MSYS
      # *.stackdump files swept in by `git add -A` on the Windows bench.  This
      # tree is clean today; the check is here to keep it that way.
      - name: reject tracked artifacts
        run: |
          set -euo pipefail
          bad=$(git ls-files | grep -E '\.(stackdump|out|map|o|obj|elf|bin|hex)$' || true)
          if [ -n "$bad" ]; then
            echo "::error::build artifacts / crash dumps are tracked:"
            echo "$bad"
            exit 1
          fi
          echo "clean"

  python-lint:
    name: python tooling compiles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # tools/gen_ota_metadata.py builds the metadata that describes an OTA
      # image.  A syntax error there is a broken release step, found at release
      # time unless something checks it.
      - name: byte-compile
        run: python3 -m compileall -q tests tools
      # tools/test_*.py (e.g. test_check_trial_marker.py, bench fact
      # 2026-09-26 follow-up) are the only host coverage for the gates
      # CMakeLists.txt shells out to at build time -- run them all, the
      # same way a contributor would locally.
      - name: tools unit tests
        run: python3 -m unittest discover -s tools -p 'test_*.py' -v

      # The factory record generator parses the production flash geometry
      # from ota_layout.h.  Exercise both that parser and the invariant that
      # the two slots meet at (and do not cross) the bank boundary (#2).
      - name: test OTA metadata generator and layout contract
        run: python3 tools/test_gen_ota_metadata.py -v

  gd32-backend-build:
    name: gd32 backend build
    runs-on: ubuntu-latest
    steps:
      # No CI job compiles hal/gd32/*.c, hal/fmc_ota.c, src/ota.c's real armed
      # state machine, or src/boot/boot_main.c (Refs #77, #31 E1) -- the
      # stub-build job above replaces the hardware HAL and never enables
      # BRIDGE_OTA_PARTITIONED. This job builds them for real, against the
      # real GD32 firmware library.  Compile-and-link only: it proves a
      # register name, a bit width, or a type is right enough to build --
      # NOT that the register sequence is correct on real silicon.  Nothing
      # here is a substitute for a bench run, and this job intentionally
      # carries no `needs-silicon` label.
      #
      # Checked out at $GITHUB_WORKSPACE (repo root).  The vendor library is
      # fetched into vendor/gd32_firmware_library/upstream below, never
      # committed.
      - uses: actions/checkout@v4

      # Same install as the stub-build job above, INCLUDING the newlib-header
      # preflight: libnewlib-arm-none-eabi is a separate Debian/Ubuntu
      # package from gcc-arm-none-eabi, and without it the first
      # #include <string.h> here fails with a confusing "No such file or
      # directory" that reads like a source bug in this job's own code.
      # Installed before any `cmake` invocation below: project() probes the
      # toolchain immediately, before CMakeLists.txt's own GD32_VENDOR_DIR
      # logic ever runs.
      - name: install the Arm GNU toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            gcc-arm-none-eabi libnewlib-arm-none-eabi
          arm-none-eabi-gcc --version | head -1
          printf '#include <string.h>\nint main(void){return 0;}\n' > /tmp/hdr.c
          arm-none-eabi-gcc -mcpu=cortex-m33 -mthumb -c /tmp/hdr.c -o /tmp/hdr.o
          echo "newlib headers reachable"

      # Negative path (Refs #110): the library is not fetched yet, so the
      # in-repo wrapper's guard must fire.  Asserts on the message naming the
      # fetch script, not just the non-zero exit -- the message is the fix.
      - name: configure (gd32 backend, library not fetched) must fail naming the fetch script
        run: |
          set -uo pipefail
          if out=$(cmake -B build-negative -S . \
              -DCMAKE_TOOLCHAIN_FILE=toolchain/arm-none-eabi.cmake \
              -DBRIDGE_HAL_BACKEND=gd32 2>&1); then
            echo "$out"
            echo "::error::configure succeeded with no GD32 library fetched; expected the FATAL_ERROR naming tools/fetch_gd32_library.sh"
            exit 1
          fi
          echo "$out"
          if ! echo "$out" | grep -q -- 'tools/fetch_gd32_library.sh'; then
            echo "::error::configure failed as expected, but the message does not name tools/fetch_gd32_library.sh"
            exit 1
          fi
          echo "negative path OK: FATAL_ERROR names tools/fetch_gd32_library.sh"

      # The GD32G5x3 firmware library is GigaDevice IP under GigaDevice's own
      # terms (THIRD_PARTY_NOTICES.md); it is never committed here and is NOT
      # taken from alp-sdk or any Alp mirror.  The script clones GigaDevice's
      # official repository and fails closed unless the commit AND the
      # Firmware/ tree hash match its pins, so a moved tag or a tampered
      # mirror cannot change what this required check compiles.  The cache is
      # only a speed/offline aid: the script re-verifies a cached checkout.
      - name: cache the GD32 vendor firmware library
        uses: actions/cache@v4
        with:
          path: vendor/gd32_firmware_library/upstream
          key: gd32-lib-${{ hashFiles('tools/fetch_gd32_library.sh') }}

      - name: fetch the GD32 vendor firmware library (pinned commit + tree hash)
        timeout-minutes: 5
        run: tools/fetch_gd32_library.sh

      # Negative path for the #127 guard: a wrapper directory with no
      # patches/ must fail rather than emit an image that hangs in
      # system_clock_216m_hxtal() before main().  Asserts on the message
      # naming the flag, not just the non-zero exit.
      - name: configure (gd32 backend, no clock patch) must fail naming the flag
        run: |
          set -uo pipefail
          mkdir -p "$RUNNER_TEMP/novendor"
          cp vendor/gd32_firmware_library/CMakeLists.txt "$RUNNER_TEMP/novendor/CMakeLists.txt"
          if out=$(cmake -B build-negative-clock -S . \
              -DCMAKE_TOOLCHAIN_FILE=toolchain/arm-none-eabi.cmake \
              -DBRIDGE_HAL_BACKEND=gd32 \
              -DGD32_VENDOR_DIR="$RUNNER_TEMP/novendor" 2>&1); then
            echo "$out"
            echo "::error::configure succeeded against a vendor dir with no clock patch; expected the FATAL_ERROR from #127 (this build would produce an image that hangs before main())"
            exit 1
          fi
          echo "$out"
          if ! echo "$out" | grep -q -- 'BRIDGE_ALLOW_STOCK_SYSTEM_INIT'; then
            echo "::error::configure failed as expected, but the message does not name -DBRIDGE_ALLOW_STOCK_SYSTEM_INIT"
            exit 1
          fi
          echo "negative path OK: FATAL_ERROR names -DBRIDGE_ALLOW_STOCK_SYSTEM_INIT"

      # The fetch script must never delete a directory it did not create and
      # must reject a cached checkout carrying extra files.
      - name: fetch script safety tests
        run: tests/test_fetch_gd32_library.sh

      # The opt-out path: against a wrapper dir with no patches/ and
      # BRIDGE_ALLOW_STOCK_SYSTEM_INIT=ON, configure must succeed and emit the
      # NOT FLASHABLE warning (#127), so the warning cannot silently vanish.
      - name: configure (gd32 backend, stock SystemInit opt-out) must warn
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/stockvendor"
          cp vendor/gd32_firmware_library/CMakeLists.txt "$RUNNER_TEMP/stockvendor/CMakeLists.txt"
          ln -sfn "$PWD/vendor/gd32_firmware_library/upstream" "$RUNNER_TEMP/stockvendor/upstream"
          out=$(cmake -B build-stock -S . -DCMAKE_TOOLCHAIN_FILE=toolchain/arm-none-eabi.cmake -DBRIDGE_HAL_BACKEND=gd32 -DBRIDGE_ALLOW_STOCK_SYSTEM_INIT=ON -DGD32_VENDOR_DIR="$RUNNER_TEMP/stockvendor" 2>&1)
          echo "$out"
          echo "$out" | grep -q 'NOT FLASHABLE' || { echo "::error::opt-out configure did not emit the NOT FLASHABLE warning"; exit 1; }

      # BRIDGE_OTA_PARTITIONED=ON, with the gd32 backend, builds THREE
      # targets from one configure: gd32-bridge-slot-a and gd32-bridge-slot-b
      # (both compile src/ota.c's real BEGIN / WRITE_CHUNK / VERIFY / COMMIT /
      # ROLLBACK / GET_STATE / ABORT machine), and gd32-bootloader (the only
      # target that compiles src/boot/boot_main.c).  The in-repo wrapper
      # applies the IRC8M clock patch, so no BRIDGE_ALLOW_STOCK_SYSTEM_INIT.
      - name: configure (gd32 backend, OTA partitioned)
        run: |
          cmake -B build-gd32 -S . \
            -DCMAKE_TOOLCHAIN_FILE=toolchain/arm-none-eabi.cmake \
            -DBRIDGE_HAL_BACKEND=gd32 \
            -DBRIDGE_OTA_PARTITIONED=ON \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: build
        run: cmake --build build-gd32 -j"$(nproc)"

      # BRIDGE_OTA_PARTITIONED defaults OFF: that's the non-partitioned
      # `gd32-bridge` target linked against toolchain/gd32g553_flash.ld --
      # the image actually flashed to the bench -- and no other job here
      # links it against the gd32 backend.
      - name: configure (gd32 backend, full-flash / non-partitioned)
        run: |
          cmake -B build-gd32-flash -S . \
            -DCMAKE_TOOLCHAIN_FILE=toolchain/arm-none-eabi.cmake \
            -DBRIDGE_HAL_BACKEND=gd32 \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: build (full-flash)
        run: cmake --build build-gd32-flash -j"$(nproc)"

      - name: verify the linked images use the IRC8M clock patch
        run: |
          set -euo pipefail
          python3 tools/check_clock_override.py build-gd32/compile_commands.json \
            build-gd32/gd32-bootloader.elf \
            build-gd32/gd32-bridge-slot-a.elf \
            build-gd32/gd32-bridge-slot-b.elf
          python3 tools/check_clock_override.py build-gd32-flash/compile_commands.json \
            build-gd32-flash/gd32-bridge.elf

      # The vendor Reset_Handler copies .data and zeroes .bss only.  Until it
      # grows an explicit TCMSRAM initialiser, every linker script must reject
      # .tcmsram input rather than emit an image that boots with garbage there.
      # KEEP() in each script makes this canary survive --gc-sections; checking
      # the diagnostic as well as the exit code proves the intended ASSERT was
      # responsible for the failure.
      - name: reject uninitialised TCMSRAM input in every image
        run: |
          set -euo pipefail
          cat >/tmp/tcmsram-canary.c <<'EOF'
          __attribute__((section(".tcmsram_canary"), used))
          volatile unsigned tcmsram_canary = 0x54434d21u;
          void Reset_Handler(void) {}
          EOF
          arm-none-eabi-gcc -mcpu=cortex-m33 -mthumb \
            -ffunction-sections -fdata-sections \
            -c /tmp/tcmsram-canary.c -o /tmp/tcmsram-canary.o

          slot_a_witness="$(find build-gd32/CMakeFiles/gd32-bridge-slot-a.dir \
            -type f \( -name 'app_slot_base.S.o' -o -name 'app_slot_base.S.obj' \) \
            -print -quit)"
          slot_b_witness="$(find build-gd32/CMakeFiles/gd32-bridge-slot-b.dir \
            -type f \( -name 'app_slot_base.S.o' -o -name 'app_slot_base.S.obj' \) \
            -print -quit)"
          test -n "$slot_a_witness" && test -n "$slot_b_witness"

          scripts=(
            toolchain/gd32g553_flash.ld
            toolchain/gd32g553_bootloader.ld
            build-gd32/gd32g553_slot_a.ld
            build-gd32/gd32g553_slot_b.ld
          )
          witnesses=("" "" "$slot_a_witness" "$slot_b_witness")
          for i in "${!scripts[@]}"; do
            script="${scripts[$i]}"
            witness="${witnesses[$i]}"
            name="$(basename "$script" .ld)"
            witness_arg=()
            if [ -n "$witness" ]; then witness_arg=("$witness"); fi
            if out=$(arm-none-eabi-gcc -mcpu=cortex-m33 -mthumb \
                -nostartfiles -Wl,--gc-sections -T"$script" \
                /tmp/tcmsram-canary.o "${witness_arg[@]}" \
                -o "/tmp/$name.elf" 2>&1); then
              echo "$out"
              echo "::error::$script accepted uninitialised .tcmsram input"
              exit 1
            fi
            if ! grep -Fq \
                'TCMSRAM sections require startup copy/zero initialization' \
                <<<"$out"; then
              echo "$out"
              echo "::error::$script failed without the TCMSRAM guard diagnostic"
              exit 1
            fi
            echo "$script: guard OK"
          done

      # A slot app uses BRIDGE_APP_SLOT_BASE for VTOR and to decide which
      # flash slot is safe to erase.  Prove that each generated linker script
      # rejects the opposite (but otherwise legal) slot base instead of
      # silently producing a self-erasing image (#78).
      - name: reject mismatched app slot bases
        run: |
          set -euo pipefail
          printf 'void Reset_Handler(void) {}\n' >/tmp/slot-base-canary.c
          arm-none-eabi-gcc -mcpu=cortex-m33 -mthumb \
            -ffunction-sections -fdata-sections \
            -c /tmp/slot-base-canary.c -o /tmp/slot-base-canary.o

          slot_a_witness="$(find build-gd32/CMakeFiles/gd32-bridge-slot-a.dir \
            -type f \( -name 'app_slot_base.S.o' -o -name 'app_slot_base.S.obj' \) \
            -print -quit)"
          slot_b_witness="$(find build-gd32/CMakeFiles/gd32-bridge-slot-b.dir \
            -type f \( -name 'app_slot_base.S.o' -o -name 'app_slot_base.S.obj' \) \
            -print -quit)"
          test -n "$slot_a_witness" && test -n "$slot_b_witness"

          scripts=(build-gd32/gd32g553_slot_a.ld build-gd32/gd32g553_slot_b.ld)
          opposite_witnesses=("$slot_b_witness" "$slot_a_witness")
          for i in "${!scripts[@]}"; do
            script="${scripts[$i]}"
            opposite_witness="${opposite_witnesses[$i]}"
            name="$(basename "$script" .ld)"
            if out=$(arm-none-eabi-gcc -mcpu=cortex-m33 -mthumb \
                -nostartfiles -Wl,--gc-sections \
                -T"$script" /tmp/slot-base-canary.o \
                "$opposite_witness" \
                -o "/tmp/$name-mismatched.elf" 2>&1); then
              echo "$out"
              echo "::error::$script accepted the opposite BRIDGE_APP_SLOT_BASE"
              exit 1
            fi
            if ! grep -Fq \
                'BRIDGE_APP_SLOT_BASE does not match linker FLASH origin' \
                <<<"$out"; then
              echo "$out"
              echo "::error::$script failed without the slot-base guard diagnostic"
              exit 1
            fi
            echo "$script: swapped base rejected"
          done

      # A link can succeed while the startup file's weak aliases still send
      # these exceptions to Default_Handler. Check both the symbol binding
      # and the actual vector words in every real image (#100).
      - name: verify core-fault vector ownership
        run: |
          python3 tools/check_fault_vectors.py \
            build-gd32/gd32-bootloader.elf \
            build-gd32/gd32-bridge-slot-a.elf \
            build-gd32/gd32-bridge-slot-b.elf \
            build-gd32-flash/gd32-bridge.elf

      # Mutate the generated slot-A length back past 0x08040000 and prove
      # the production linker assertion rejects it.  A/B address ranges can
      # remain disjoint while slot A still crosses into slot B's physical
      # bank, which is the read-while-write hazard fixed by #2.
      - name: reject OTA slots that cross the flash-bank boundary
        run: |
          set -euo pipefail
          script=build-gd32/gd32g553_slot_a.ld
          mutated=/tmp/gd32g553_slot_a_crosses_bank.ld
          # Grow the generated slot-A LENGTH by one 4 KB step: geometry stays
          # sourced from src/ota_layout.h, nothing is pinned here.
          len_hex="$(grep -E '^ *FLASH ' "$script" | grep -oE 'LENGTH = 0x[0-9A-Fa-f]+' | cut -d' ' -f3)"
          bad_hex="$(printf '0x%08X' $((len_hex + 0x1000)))"
          sed "s/LENGTH = $len_hex/LENGTH = $bad_hex/" "$script" >"$mutated"
          grep -Fq "LENGTH = $bad_hex" "$mutated"

          printf 'void Reset_Handler(void) {}\n' >/tmp/bank-boundary-canary.c
          arm-none-eabi-gcc -mcpu=cortex-m33 -mthumb \
            -ffunction-sections -fdata-sections \
            -c /tmp/bank-boundary-canary.c -o /tmp/bank-boundary-canary.o
          slot_a_witness="$(find build-gd32/CMakeFiles/gd32-bridge-slot-a.dir \
            -type f \( -name 'app_slot_base.S.o' -o -name 'app_slot_base.S.obj' \) \
            -print -quit)"
          test -n "$slot_a_witness"

          if out=$(arm-none-eabi-gcc -mcpu=cortex-m33 -mthumb \
              -nostartfiles -Wl,--gc-sections -T"$mutated" \
              /tmp/bank-boundary-canary.o "$slot_a_witness" \
              -o /tmp/gd32g553_slot_a_crosses_bank.elf 2>&1); then
            echo "$out"
            echo '::error::slot linker accepted a bank-crossing application'
            exit 1
          fi
          if ! grep -Fq 'application slot crosses dual-bank boundary' \
              <<<"$out"; then
            echo "$out"
            echo '::error::link failed without the bank-boundary guard diagnostic'
            exit 1
          fi
          echo 'bank-crossing slot rejected'
