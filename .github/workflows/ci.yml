# SPDX-License-Identifier: Apache-2.0
#
# CI for the GD32 bridge firmware.
#
# What this CAN check, and what it deliberately cannot:
#
#   * The `stub` backend job compiles every protocol/dispatch source with the
#     hardware-touching HAL replaced by hal/bridge_hw_stub.c.  With
#     BRIDGE_HAL_BACKEND=stub (the CMake default), src/ota.c's armed state
#     machine is preprocessed away to a 22-line inert stub -- that job alone
#     does NOT compile the OTA state machine.
#   * The `gd32 backend build` job (below) stages the real GD32 firmware
#     library from the pinned public mirror
#     https://github.com/alplabai/gd32g5x3-firmware-library and configures
#     -DBRIDGE_HAL_BACKEND=gd32 -DBRIDGE_OTA_PARTITIONED=ON, which compiles
#     and links every hal/gd32/*.c file, hal/transport_hw_gd32.c,
#     hal/fmc_ota.c, src/ota.c's real armed state machine, and
#     src/boot/boot_main.c -- the layer no other job here touches.
#     Compile-and-link only; it proves nothing about on-silicon behaviour.
#   * On-silicon behaviour is NOT covered by any job here.  The bridge talks
#     SPI and I2C to a Renesas RZ/V2N on a real SoM; nothing here substitutes
#     for a bench run.
#
# The protocol vectors ARE checked, and that is the strongest gate available
# without hardware: tests/gen_protocol_vectors.py is the authoritative source
# for the canonical wire vectors consumed by BOTH this firmware and the
# host-side driver tests in alp-sdk.  Regenerating and diffing turns "the wire
# changed" from something you notice on a bench into a failing check.

name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stub-build:
    name: stub build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # This is Cortex-M33 firmware: every target is linked against a device
      # linker script and post-processed with objcopy, so the host compiler
      # cannot build it even with the stub HAL.  toolchain/arm-none-eabi.cmake
      # is the invocation CMakeLists.txt documents, and it sets
      # CMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY precisely because the
      # result is freestanding and never runs on the builder.
      - name: install the Arm GNU toolchain
        run: |
          sudo apt-get update -qq
          # libnewlib-arm-none-eabi is NOT optional and is a separate package
          # on Debian/Ubuntu: gcc-arm-none-eabi alone installs the compiler
          # with no C library headers, so the first #include <string.h> fails
          # with "No such file or directory" -- which reads like a source bug
          # and is not one.
          sudo apt-get install -y --no-install-recommends \
            gcc-arm-none-eabi libnewlib-arm-none-eabi
          arm-none-eabi-gcc --version | head -1
          # Prove the headers are actually reachable before CMake tries, so a
          # packaging regression reports itself here rather than as a confusing
          # "fatal error: string.h" against a source file.
          printf '#include <string.h>\nint main(void){return 0;}\n' > /tmp/hdr.c
          arm-none-eabi-gcc -mcpu=cortex-m33 -mthumb -c /tmp/hdr.c -o /tmp/hdr.o
          echo "newlib headers reachable"

      - name: configure
        run: |
          cmake -B build -S . \
            -DCMAKE_TOOLCHAIN_FILE=toolchain/arm-none-eabi.cmake \
            -DBRIDGE_HAL_BACKEND=stub

      - name: build
        run: cmake --build build -j"$(nproc)"

  unit-tests:
    name: unit tests (host)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # These suites link the REAL firmware sources -- ota.c, crc32.c,
      # transport_spi.c, protocol.c, bootloader.c -- not mocks, so the OTA
      # bounds checks and the SPI CS-framing seams under test are the same code
      # paths the device runs.  They came from alp-sdk, where they ran under
      # twister; the firmware moved here (alp-sdk ADR 0031) and the tests moved
      # with it, because a test that lives in a different repository from its
      # subject is a test nobody runs.
      #
      # Host-only, no Zephyr: the code under test is freestanding C, and only
      # the ztest harness was ever Zephyr-specific.  tests/unit/ztest_shim.h
      # replaces the six macros the suites use.
      - name: configure
        run: cmake -S tests/unit -B build-tests -DCMAKE_BUILD_TYPE=Debug

      - name: build
        run: cmake --build build-tests --parallel

      - name: run
        run: ctest --test-dir build-tests --output-on-failure

  protocol-vectors:
    name: protocol vectors are regenerated
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # tests/gen_protocol_vectors.py calls itself the authoritative source for
      # these vectors, and its own docstring says to diff the output against git
      # to spot unexpected wire changes.  This is that diff, run automatically.
      # A committed protocol_vectors.txt that the generator no longer produces
      # means the wire moved and one of the two sides was not updated -- and the
      # OTHER consumer is in a different repository (alp-sdk's host-side driver
      # tests), so nothing else would notice.
      - name: regenerate and diff
        run: |
          set -euo pipefail
          python3 tests/gen_protocol_vectors.py
          if ! git diff --exit-code -- tests/protocol_vectors.txt; then
            echo "::error::tests/protocol_vectors.txt is not what gen_protocol_vectors.py produces."
            echo "Regenerate it and commit the result, in the SAME change as the wire edit."
            exit 1
          fi

  clang-format:
    name: clang-format (diff only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Diff-only: this tree carries vendor-shaped sources and a tree-wide
      # reformat would bury a real review in noise.
      - name: install clang-format 22
        run: pipx install "clang-format==22.1.5"

      - name: check changed C/H files
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          if [ -z "$base" ]; then base=$(git rev-parse HEAD~1); fi
          files=$(git diff --name-only --diff-filter=ACMR "$base" HEAD -- '*.c' '*.h' || true)
          if [ -z "$files" ]; then echo "no C/H files changed"; exit 0; fi
          echo "$files"
          # shellcheck disable=SC2086
          clang-format --dry-run --Werror $files

  no-build-artifacts:
    name: no build artifacts or crash dumps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The sibling cc3501e repo had a 14 MB .out, a 2 MB .map and MSYS
      # *.stackdump files swept in by `git add -A` on the Windows bench.  This
      # tree is clean today; the check is here to keep it that way.
      - name: reject tracked artifacts
        run: |
          set -euo pipefail
          bad=$(git ls-files | grep -E '\.(stackdump|out|map|o|obj|elf|bin|hex)$' || true)
          if [ -n "$bad" ]; then
            echo "::error::build artifacts / crash dumps are tracked:"
            echo "$bad"
            exit 1
          fi
          echo "clean"

  python-lint:
    name: python tooling compiles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # tools/gen_ota_metadata.py builds the metadata that describes an OTA
      # image.  A syntax error there is a broken release step, found at release
      # time unless something checks it.
      - name: byte-compile
        run: python3 -m compileall -q tests tools

  gd32-backend-build:
    name: gd32 backend build
    runs-on: ubuntu-latest
    steps:
      # No CI job compiles hal/gd32/*.c, hal/fmc_ota.c, src/ota.c's real armed
      # state machine, or src/boot/boot_main.c (Refs #77, #31 E1) -- the
      # stub-build job above replaces the hardware HAL and never enables
      # BRIDGE_OTA_PARTITIONED. This job builds them for real, against the
      # real GD32 firmware library.  Compile-and-link only: it proves a
      # register name, a bit width, or a type is right enough to build --
      # NOT that the register sequence is correct on real silicon.  Nothing
      # here is a substitute for a bench run, and this job intentionally
      # carries no `needs-silicon` label.
      #
      # Checked out at $GITHUB_WORKSPACE/firmware/gd32-bridge, i.e. two
      # levels below $GITHUB_WORKSPACE, where the vendor tree gets staged
      # below -- so CMakeLists.txt's existing hardcoded fallback
      # (CMAKE_CURRENT_SOURCE_DIR/../../vendors/gd32_firmware_library, the
      # pre-split alp-sdk layout) resolves with NO CMakeLists.txt change.
      # This job does not depend on PR #67's GD32_VENDOR_DIR cache-variable
      # override landing first; see the PR body for why.
      - uses: actions/checkout@v4
        with:
          path: firmware/gd32-bridge

      # ci/gd32_vendor_wrapper/CMakeLists.txt is this repo's own Apache-2.0
      # glue (a copy of alp-sdk's vendors/gd32_firmware_library/CMakeLists.txt
      # wrapper) -- it is NOT GigaDevice IP and carries no vendor licence
      # terms.  Stage it at the fallback path the real wrapper normally
      # occupies.
      - name: stage the vendor wrapper CMakeLists
        run: |
          set -euo pipefail
          mkdir -p vendors/gd32_firmware_library
          cp firmware/gd32-bridge/ci/gd32_vendor_wrapper/CMakeLists.txt \
             vendors/gd32_firmware_library/CMakeLists.txt

      # The actual GD32G5x3 firmware library IS GigaDevice IP, redistributed
      # under SLA-GD0001 v1.1 -- see that licence's terms, quoted in full in
      # this repo's PR body and in alp-sdk's vendors/gd32_firmware_library/
      # README.md.  It is not vendored into any repo's main tree; fetched
      # here from the pinned public mirror alp-sdk itself pins as a
      # submodule, by TAG (v1.5.0), never a moving branch.
      - name: fetch the GD32 vendor firmware library (v1.5.0, pinned by tag)
        run: |
          git clone --branch v1.5.0 --depth 1 \
            https://github.com/alplabai/gd32g5x3-firmware-library.git \
            vendors/gd32_firmware_library/upstream

      # Same install as the stub-build job above.
      - name: install the Arm GNU toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            gcc-arm-none-eabi libnewlib-arm-none-eabi
          arm-none-eabi-gcc --version | head -1

      # BRIDGE_OTA_PARTITIONED=ON, with the gd32 backend, builds THREE
      # targets from one configure: gd32-bridge-slot-a and
      # gd32-bridge-slot-b (both compile src/ota.c's real BEGIN / WRITE_CHUNK
      # / VERIFY / COMMIT / ROLLBACK / GET_STATE / ABORT machine, since
      # BRIDGE_OTA_PARTITIONED is defined for them and src/ota.c:56-482 is no
      # longer preprocessed out), and gd32-bootloader (the only target that
      # compiles src/boot/boot_main.c).  All three share
      # CMakeLists.txt's GD32_BRIDGE_SOURCES list, so this single configure
      # also compiles every hal/gd32/*.c file and hal/transport_hw_gd32.c.
      - name: configure (gd32 backend, OTA partitioned)
        working-directory: firmware/gd32-bridge
        run: |
          cmake -B build-gd32 -S . \
            -DCMAKE_TOOLCHAIN_FILE=toolchain/arm-none-eabi.cmake \
            -DBRIDGE_HAL_BACKEND=gd32 \
            -DBRIDGE_OTA_PARTITIONED=ON

      - name: build
        working-directory: firmware/gd32-bridge
        run: cmake --build build-gd32 -j"$(nproc)"
